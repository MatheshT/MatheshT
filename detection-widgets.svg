<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Detection engineering and cybersecurity capability dashboard</title>
  <desc id="desc">A lightweight animated dashboard showing detection engineering, threat intelligence, DFIR, cloud security, penetration testing, and security automation capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060a16"/><stop offset=".5" stop-color="#0b1428"/><stop offset="1" stop-color="#180b2d"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00f5d4"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8be9fd" opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#bg)"/><rect width="1200" height="430" rx="20" fill="url(#p)"/>
  <g font-family="monospace">
    <text x="40" y="42" fill="#00f5d4" font-size="14" font-weight="700" letter-spacing="3">DETECTION ENGINEERING // LIVE CONTROL WIDGETS</text>
    <text x="40" y="66" fill="#64748b" font-size="11" letter-spacing="1">SIGNAL QUALITY • RULE COVERAGE • THREAT CONTEXT • RESPONSE READINESS</text>
    <text x="1012" y="42" fill="#22c55e" font-size="11">● TELEMETRY LIVE</text>
    <g transform="translate(40 95)">
      <rect width="260" height="148" rx="12" fill="#07111f" stroke="#00f5d4" stroke-opacity=".5"/>
      <text x="18" y="27" fill="#64748b" font-size="10">RULE ENGINE</text><text x="18" y="56" fill="#e6fffb" font-size="22" font-weight="700">SIGMA / KQL</text>
      <text x="18" y="85" fill="#8be9fd" font-size="11">DETECTION COVERAGE</text><path d="M18 103h210" stroke="#153441" stroke-width="7"/><path d="M18 103h179" stroke="url(#cyan)" stroke-width="7"><animate attributeName="x2" values="170;210;180" dur="4s" repeatCount="indefinite"/></path><text x="18" y="130" fill="#00f5d4" font-size="16">85.2%</text><text x="122" y="130" fill="#64748b" font-size="10">42 ACTIVE RULES</text>
    </g>
    <g transform="translate(320 95)">
      <rect width="260" height="148" rx="12" fill="#07111f" stroke="#7c3aed" stroke-opacity=".58"/>
      <text x="18" y="27" fill="#64748b" font-size="10">THREAT INTELLIGENCE</text><text x="18" y="56" fill="#e6fffb" font-size="22" font-weight="700">IOC / MITRE</text>
      <g transform="translate(20 82)" fill="#7c3aed"><circle r="6"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle><circle cx="48" cy="24" r="6"/><circle cx="100" cy="-3" r="6"/><circle cx="153" cy="25" r="6"/><path d="M6 3L42 20M54 21L94 1M106 1L147 22" stroke="#c4b5fd" stroke-width="2"/></g><text x="18" y="126" fill="#c4b5fd" font-size="12">TACTICS MAPPED: 18</text>
    </g>
    <g transform="translate(600 95)">
      <rect width="260" height="148" rx="12" fill="#07111f" stroke="#0ea5e9" stroke-opacity=".58"/>
      <text x="18" y="27" fill="#64748b" font-size="10">CLOUD + NETWORK</text><text x="18" y="56" fill="#e6fffb" font-size="22" font-weight="700">HARDEN / HUNT</text>
      <path d="M20 105L58 71L98 95L140 55L190 90L228 45" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.6s" repeatCount="indefinite"/></path><g fill="#8be9fd"><circle cx="20" cy="105" r="5"/><circle cx="58" cy="71" r="5"/><circle cx="98" cy="95" r="5"/><circle cx="140" cy="55" r="5"/><circle cx="190" cy="90" r="5"/><circle cx="228" cy="45" r="5"/></g><text x="18" y="130" fill="#8be9fd" font-size="12">NODES MONITORED: 05</text>
    </g>
    <g transform="translate(880 95)">
      <rect width="280" height="148" rx="12" fill="#07111f" stroke="#ff6b35" stroke-opacity=".6"/>
      <text x="18" y="27" fill="#64748b" font-size="10">RESPONSE + FORENSICS</text><text x="18" y="56" fill="#e6fffb" font-size="22" font-weight="700">DFIR / SOAR</text>
      <text x="18" y="86" fill="#ff996b" font-size="11">TRIAGE</text><text x="96" y="86" fill="#ff996b" font-size="11">CONTAIN</text><text x="192" y="86" fill="#ff996b" font-size="11">RECOVER</text><path d="M20 103h235" stroke="#40261d" stroke-width="5"/><path d="M20 103h194" stroke="#ff6b35" stroke-width="5"><animate attributeName="x2" values="170;235;194" dur="3.5s" repeatCount="indefinite"/></path><text x="18" y="130" fill="#ff996b" font-size="12">PLAYBOOKS READY: 12</text>
    </g>
    <g transform="translate(40 280)">
      <text fill="#64748b" font-size="11">CYBERSECURITY COVERAGE</text>
      <g transform="translate(0 22)" font-size="12"><rect width="132" height="38" rx="8" fill="#00f5d4" fill-opacity=".12" stroke="#00f5d4" stroke-opacity=".55"/><text x="18" y="24" fill="#8be9fd">SOC / SIEM</text><rect x="145" width="132" height="38" rx="8" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".6"/><text x="163" y="24" fill="#c4b5fd">THREAT HUNT</text><rect x="290" width="132" height="38" rx="8" fill="#0ea5e9" fill-opacity=".14" stroke="#0ea5e9" stroke-opacity=".6"/><text x="311" y="24" fill="#8be9fd">CLOUD SEC</text><rect x="435" width="132" height="38" rx="8" fill="#ff6b35" fill-opacity=".14" stroke="#ff6b35" stroke-opacity=".6"/><text x="454" y="24" fill="#ff996b">PENTEST</text><rect x="580" width="132" height="38" rx="8" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-opacity=".6"/><text x="597" y="24" fill="#86efac">AUTOMATION</text><rect x="725" width="132" height="38" rx="8" fill="#d946ef" fill-opacity=".14" stroke="#d946ef" stroke-opacity=".6"/><text x="744" y="24" fill="#f0abfc">GRC / RISK</text><rect x="870" width="132" height="38" rx="8" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".6"/><text x="889" y="24" fill="#ddd6fe">APPSEC</text></g>
    </g>
    <text x="40" y="395" fill="#00f5d4" font-size="11" letter-spacing="2">BUILD • DETECT • INVESTIGATE • HARDEN • RESPOND</text><text x="955" y="395" fill="#64748b" font-size="10">PERFORMANCE MODE: LIGHT</text>
  </g>
</svg>
