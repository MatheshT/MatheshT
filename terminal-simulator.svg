<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Interactive-style cybersecurity terminal simulator</title>
  <desc id="desc">A lightweight animated terminal visual showing safe commands visitors can explore: help, projects, skills, and contact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030711"/><stop offset="1" stop-color="#16082a"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#00f5d4"/><stop offset="1" stop-color="#b026ff"/></linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H6" stroke="#8be9fd" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1200" height="350" rx="20" fill="url(#bg)"/><rect width="1200" height="350" rx="20" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#00f5d4" stroke-opacity=".45"/>
  <rect x="0" y="64" width="1200" height="2" fill="url(#line)" opacity=".7"><animate attributeName="y" values="64;330;64" dur="8s" repeatCount="indefinite"/></rect>
  <g font-family="monospace">
    <circle cx="32" cy="31" r="6" fill="#ff5f56"/><circle cx="51" cy="31" r="6" fill="#ffbd2e"/><circle cx="70" cy="31" r="6" fill="#27c93f"/>
    <text x="102" y="36" fill="#64748b" font-size="12" letter-spacing="2">MATHESHT@DEFENSE-GRID:~$</text><text x="1005" y="36" fill="#22c55e" font-size="11">● SAFE MODE</text>
    <text x="42" y="100" fill="#22c55e" font-size="14">visitor@mathesht:~$</text><text x="225" y="100" fill="#e6fffb" font-size="14">./explore --security-profile</text>
    <text x="42" y="132" fill="#00f5d4" font-size="13">[ OK ] loading defensive capabilities...</text><text x="42" y="158" fill="#8be9fd" font-size="13">[ OK ] mapping cyber domains: SOC | CLOUD | DFIR | APPSEC | GRC</text>
    <text x="42" y="184" fill="#c4b5fd" font-size="13">[ OK ] projects found: MCP Security Copilot | Detection Lab | Automation Tools</text>
    <text x="42" y="226" fill="#ff996b" font-size="13">AVAILABLE COMMANDS</text>
    <g font-size="14"><rect x="42" y="246" width="110" height="34" rx="7" fill="#00f5d4" fill-opacity=".13" stroke="#00f5d4" stroke-opacity=".65"/><text x="63" y="268" fill="#8be9fd">help</text><rect x="170" y="246" width="130" height="34" rx="7" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".65"/><text x="193" y="268" fill="#c4b5fd">projects</text><rect x="318" y="246" width="110" height="34" rx="7" fill="#0ea5e9" fill-opacity=".14" stroke="#0ea5e9" stroke-opacity=".65"/><text x="342" y="268" fill="#8be9fd">skills</text><rect x="446" y="246" width="120" height="34" rx="7" fill="#ff6b35" fill-opacity=".14" stroke="#ff6b35" stroke-opacity=".65"/><text x="469" y="268" fill="#ff996b">contact</text></g>
    <text x="42" y="316" fill="#22c55e" font-size="13">visitor@mathesht:~$</text><text x="225" y="316" fill="#e6fffb" font-size="13">_</text><rect x="225" y="303" width="9" height="17" fill="#00f5d4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><text x="1000" y="316" fill="#64748b" font-size="10">INTERACTIVE-STYLE UI</text>
  </g>
</svg>
