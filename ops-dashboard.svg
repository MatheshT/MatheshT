<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity operations dashboard</title>
  <desc id="desc">A professional animated SOC dashboard with glowing status cards, threat levels, signal bars, and rotating interface accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#160d2d"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5d4"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <g font-family="monospace">
    <text x="42" y="43" fill="#00f5d4" font-size="13" letter-spacing="3">DEFENSIVE OPERATIONS // CONTROL SURFACE</text>
    <text x="42" y="70" fill="#64748b" font-size="11">REAL-TIME CAPABILITY MONITORING • AUTOMATION • INCIDENT READINESS</text>
    <g transform="translate(42 103)">
      <rect width="250" height="172" rx="14" fill="#07111f" stroke="#00f5d4" stroke-opacity=".45"/>
      <text x="20" y="31" fill="#64748b" font-size="11">SOC OPERATIONS</text><text x="20" y="67" fill="#e6fffb" font-size="25">READY</text><circle cx="205" cy="58" r="17" fill="#22c55e" opacity=".12"/><circle cx="205" cy="58" r="7" fill="#22c55e"><animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/></circle>
      <text x="20" y="103" fill="#64748b" font-size="10">SIGNAL QUALITY</text><path d="M20 124h190" stroke="#173c4a" stroke-width="5"/><path d="M20 124h165" stroke="url(#c)" stroke-width="5"/><text x="20" y="153" fill="#00f5d4" font-size="16">98.7%</text>
    </g>
    <g transform="translate(318 103)">
      <rect width="250" height="172" rx="14" fill="#07111f" stroke="#7c3aed" stroke-opacity=".55"/>
      <text x="20" y="31" fill="#64748b" font-size="11">THREAT DETECTION</text><text x="20" y="67" fill="#e6fffb" font-size="25">LOW NOISE</text>
      <g transform="translate(20 92)" fill="#7c3aed"><rect width="17" height="37" rx="3"><animate attributeName="height" values="24;37;18;32;24" dur="2s" repeatCount="indefinite"/></rect><rect x="28" width="17" height="52" rx="3"><animate attributeName="height" values="45;20;52;32;45" dur="2.3s" repeatCount="indefinite"/></rect><rect x="56" width="17" height="30" rx="3"><animate attributeName="height" values="30;52;25;42;30" dur="1.8s" repeatCount="indefinite"/></rect><rect x="84" width="17" height="44" rx="3"><animate attributeName="height" values="40;28;48;22;40" dur="2.1s" repeatCount="indefinite"/></rect><rect x="112" width="17" height="24" rx="3"><animate attributeName="height" values="18;42;27;51;18" dur="2.5s" repeatCount="indefinite"/></rect></g><text x="166" y="125" fill="#c4b5fd" font-size="12">RULES ACTIVE</text><text x="166" y="151" fill="#7c3aed" font-size="18">042</text>
    </g>
    <g transform="translate(594 103)">
      <rect width="250" height="172" rx="14" fill="#07111f" stroke="#0ea5e9" stroke-opacity=".55"/>
      <text x="20" y="31" fill="#64748b" font-size="11">CLOUD SECURITY</text><text x="20" y="67" fill="#e6fffb" font-size="25">HARDENED</text><path d="M24 113L65 83L105 108L150 69L210 112" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path><circle cx="24" cy="113" r="5" fill="#8be9fd"/><circle cx="65" cy="83" r="5" fill="#8be9fd"/><circle cx="105" cy="108" r="5" fill="#8be9fd"/><circle cx="150" cy="69" r="5" fill="#8be9fd"/><circle cx="210" cy="112" r="5" fill="#8be9fd"/><text x="20" y="153" fill="#8be9fd" font-size="11">MONITORING NODES: 05</text>
    </g>
    <g transform="translate(870 103)">
      <rect width="288" height="172" rx="14" fill="#07111f" stroke="#ff6b35" stroke-opacity=".65"/>
      <text x="20" y="31" fill="#64748b" font-size="11">INCIDENT RESPONSE</text><text x="20" y="67" fill="#e6fffb" font-size="25">CONTROLLED</text><text x="20" y="102" fill="#ff996b" font-size="11">ALERT → ENRICH → CORRELATE</text><text x="20" y="126" fill="#ff996b" font-size="11">INVESTIGATE → REPORT</text><path d="M20 147H250" stroke="#3e2119" stroke-width="5"/><path d="M20 147H221" stroke="#ff6b35" stroke-width="5"><animate attributeName="x2" values="180;235;195;221" dur="3s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
