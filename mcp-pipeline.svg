<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">MCP Security Copilot investigation pipeline</title>
  <desc id="desc">Animated five-stage cybersecurity investigation pipeline: alert, enrich, correlate, investigate, report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#170d2c"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5d4"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff6b35"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <path d="M70 151 H1130" stroke="#1b3551" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 151 H1130" stroke="url(#wire)" stroke-width="2" stroke-dasharray="16 18" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.5s" repeatCount="indefinite"/></path>
  <g font-family="monospace" text-anchor="middle">
    <text x="600" y="43" fill="#e6fffb" font-size="22" font-weight="700" letter-spacing="3">MCP SECURITY COPILOT</text>
    <text x="600" y="68" fill="#64748b" font-size="11" letter-spacing="2">AUTOMATE THE REPETITION • PRESERVE ANALYST CONTROL</text>
    <g transform="translate(120 151)"><circle r="50" fill="#07111f" stroke="#00f5d4" stroke-width="3"/><circle r="38" fill="none" stroke="#00f5d4" stroke-opacity=".3" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></circle><path d="M0-20L20 0L0 20L-20 0Z" fill="none" stroke="#00f5d4" stroke-width="3"/><text y="82" fill="#00f5d4" font-size="14">ALERT</text><text y="101" fill="#64748b" font-size="10">DETECT</text></g>
    <g transform="translate(360 151)"><circle r="50" fill="#07111f" stroke="#0ea5e9" stroke-width="3"/><circle r="27" fill="#0ea5e9" opacity=".16"><animate attributeName="r" values="20;35;20" dur="2s" repeatCount="indefinite"/></circle><path d="M-17 0h34M0-17v34" stroke="#8be9fd" stroke-width="3"/><text y="82" fill="#8be9fd" font-size="14">ENRICH</text><text y="101" fill="#64748b" font-size="10">CONTEXT</text></g>
    <g transform="translate(600 151)"><circle r="50" fill="#07111f" stroke="#7c3aed" stroke-width="3"/><path d="M-23-10H0L23-26M-23 10H0L23 26" fill="none" stroke="#c4b5fd" stroke-width="3"/><circle cx="-23" cy="-10" r="5" fill="#7c3aed"/><circle cx="-23" cy="10" r="5" fill="#7c3aed"/><circle cx="23" cy="-26" r="5" fill="#d946ef"/><circle cx="23" cy="26" r="5" fill="#d946ef"/><text y="82" fill="#c4b5fd" font-size="14">CORRELATE</text><text y="101" fill="#64748b" font-size="10">CONNECT</text></g>
    <g transform="translate(840 151)"><circle r="50" fill="#07111f" stroke="#f97316" stroke-width="3"/><path d="M0-28A28 28 0 1 0 28 0" fill="none" stroke="#ff6b35" stroke-width="5"/><path d="M28 0l-14-4M28 0l-4 14" stroke="#ff6b35" stroke-width="4"/><text y="82" fill="#ff996b" font-size="14">INVESTIGATE</text><text y="101" fill="#64748b" font-size="10">DECIDE</text></g>
    <g transform="translate(1080 151)"><circle r="50" fill="#07111f" stroke="#22c55e" stroke-width="3"/><path d="M-21 0l14 14L23-18" fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round"/><text y="82" fill="#86efac" font-size="14">REPORT</text><text y="101" fill="#64748b" font-size="10">RESPOND</text></g>
  </g>
  <g filter="url(#glow)"><circle r="6" fill="#e6fffb"><animateMotion dur="5s" repeatCount="indefinite" path="M70 151H1130"/></circle><circle r="4" fill="#00f5d4"><animateMotion dur="5s" begin="1.3s" repeatCount="indefinite" path="M70 151H1130"/></circle></g>
</svg>
