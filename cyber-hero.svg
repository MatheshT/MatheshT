<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mathesh T Cybersecurity Operations Interface</title>
  <desc id="desc">A dark futuristic cyber security dashboard with a glowing 3D core, animated radar, perspective grid, and floating SOC status panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".52" stop-color="#0b1226"/><stop offset="1" stop-color="#160d2d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00f5d4"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#00f5d4" stop-opacity=".34"/><stop offset=".42" stop-color="#7c3aed" stop-opacity=".16"/><stop offset="1" stop-color="#050816" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#5eead4" opacity=".18"/></pattern>
    <clipPath id="screen"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#dots)"/>
    <ellipse cx="615" cy="232" rx="300" ry="220" fill="url(#halo)" filter="url(#soft)"/>
    <g opacity=".6" stroke="#00f5d4" stroke-width="1">
      <path d="M-40 375 L1240 375 M55 345 L1145 345 M132 315 L1068 315 M206 285 L994 285 M272 255 L928 255"/>
      <path d="M120 430 L515 220 M275 430 L555 220 M440 430 L585 220 M605 430 L615 220 M770 430 L645 220 M935 430 L675 220 M1100 430 L705 220"/>
    </g>
    <g fill="none" stroke="#18294b" stroke-width="1"><path d="M0 72H1200M0 122H1200M0 172H1200"/><path d="M105 0V220M190 0V220M1010 0V220M1095 0V220"/></g>
    <g font-family="monospace" letter-spacing="2">
      <text x="58" y="66" fill="#00f5d4" font-size="13">MATHESH T // DEFENSIVE ENGINEERING</text>
      <text x="58" y="100" fill="#e6fffb" font-size="34" font-weight="700">SECURE THE SIGNAL.</text>
      <text x="60" y="128" fill="#8be9fd" font-size="14">SOC OPERATIONS  •  THREAT DETECTION  •  AUTOMATION</text>
      <text x="1010" y="64" fill="#22c55e" font-size="12">● SYSTEM ONLINE</text>
      <text x="1010" y="86" fill="#64748b" font-size="10">NODE: MATHESHT-01</text>
    </g>
    <g transform="translate(610 228)" filter="url(#glow)">
      <circle r="128" fill="none" stroke="#00f5d4" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
      <circle r="104" fill="none" stroke="#7c3aed" stroke-opacity=".42" stroke-width="3" stroke-dasharray="50 18 8 18"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/></circle>
      <path d="M0-100 L28-28 L100 0 L28 28 L0 100 L-28 28 L-100 0 L-28-28 Z" fill="none" stroke="url(#cyan)" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></path>
      <path d="M0-63 L63 0 L0 63 L-63 0 Z" fill="none" stroke="url(#violet)" stroke-width="7" opacity=".85"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></path>
      <circle r="34" fill="#07111f" stroke="#00f5d4" stroke-width="3"/>
      <circle r="13" fill="#00f5d4"><animate attributeName="r" values="10;17;10" dur="2s" repeatCount="indefinite"/></circle>
      <text x="-25" y="-158" fill="#8be9fd" font-size="10" font-family="monospace">THREAT CORE</text>
    </g>
    <g font-family="monospace" font-size="11">
      <g transform="translate(58 188)"><rect width="238" height="78" rx="10" fill="#07111f" stroke="#00f5d4" stroke-opacity=".45"/><text x="18" y="24" fill="#64748b">LIVE TELEMETRY</text><text x="18" y="51" fill="#00f5d4" font-size="20">98.7%</text><text x="120" y="51" fill="#22c55e">SIGNAL QUALITY ▲</text><path d="M18 63h200" stroke="#173c4a"/><path d="M18 63h171" stroke="#00f5d4" stroke-width="2"/></g>
      <g transform="translate(904 178)"><rect width="238" height="92" rx="10" fill="#07111f" stroke="#7c3aed" stroke-opacity=".65"/><text x="18" y="24" fill="#64748b">DEFENDER STATUS</text><text x="18" y="52" fill="#e6fffb" font-size="18">READY</text><circle cx="204" cy="46" r="13" fill="#22c55e" opacity=".18"/><circle cx="204" cy="46" r="5" fill="#22c55e"/><text x="18" y="76" fill="#8be9fd">ALERT → ENRICH → RESPOND</text></g>
      <g transform="translate(58 320)"><text fill="#64748b">ACTIVE MODULES</text><text y="23" fill="#00f5d4">WAZUH  /  IOC CORRELATION  /  REPORTING</text></g>
      <g transform="translate(900 325)"><text fill="#64748b">MISSION</text><text y="23" fill="#ff6b35">MAKE DEFENDERS FASTER</text></g>
    </g>
    <path d="M0 414 H1200" stroke="#00f5d4" stroke-opacity=".6"/>
  </g>
</svg>
